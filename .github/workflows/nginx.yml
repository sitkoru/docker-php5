name: Nginx
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: php5-nginx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: with-nginx
          platforms: linux/amd64
          load: true
          push: false
          tags: php5-check:nginx
          cache-from: |
            type=gha,scope=php5-nginx
            type=gha,scope=php5-fpm
          cache-to: type=gha,mode=max,scope=php5-nginx
      - name: Check HTTP to PHP and startup hook
        run: |
          trap 'docker rm -f php5-nginx-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name php5-nginx-check --network none --memory 256m --pids-limit 128 \
            -e APP_BEFORE_START_SCRIPT=/checks/before-start.sh \
            -v "$PWD/tests:/checks:ro" \
            -v "$PWD/tests/nginx-site.conf:/etc/nginx/conf.d/site.conf:ro" \
            -v "$PWD/tests/nginx-index.php:/var/www/html/index.php:ro" php5-check:nginx
          timeout 120 docker exec php5-nginx-check sh /checks/nginx.sh
          timeout 120 docker exec php5-nginx-check sh /checks/smoke.sh
