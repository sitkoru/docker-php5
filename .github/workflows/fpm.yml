name: FPM

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php5-fpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build and load
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: fpm
          platforms: linux/amd64
          load: true
          push: false
          tags: php5-check:fpm
          cache-from: type=gha,scope=php5-fpm
          cache-to: type=gha,mode=max,scope=php5-fpm
      - name: Check CLI and extensions
        run: |
          trap 'docker rm -f php5-cli-check >/dev/null 2>&1 || true' EXIT
          timeout 120 docker run --rm --name php5-cli-check --network none --memory 256m --pids-limit 128 -e PHP_IMAGE_TARGET=fpm -v "$PWD/tests:/checks:ro" php5-check:fpm sh /checks/smoke.sh
      - name: Check FPM request
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: verify
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=php5-fpm
      - name: Check upstream multipart and upload progress regressions
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: regression
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=php5-fpm
      - name: Prepare release tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        id: prep
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          version=edge
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then version="${RELEASE_REF#refs/tags/}"; fi
          image=ghcr.io/sitkoru/php5
          tags="$image:$version,$image:sha-${GITHUB_SHA::8}"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="$tags,$image:${version%.*},$image:${version%%.*},$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Login for release
        if: steps.prep.outcome == 'success'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Publish verified release
        if: steps.prep.outcome == 'success'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: fpm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha,scope=php5-fpm
